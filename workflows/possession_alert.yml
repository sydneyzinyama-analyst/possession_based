name: Possession Dominance Alert

on:
  schedule:
    # Every 30 minutes, UTC time (GitHub Actions cron is always UTC,
    # not your local timezone)
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button for manual testing

jobs:
  run-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python flashscore_possession_dominance_alert.py --start 0 --limit 100
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
